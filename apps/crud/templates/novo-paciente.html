{% extends 'base-crud.html' %}
{% block title %}CRUD | Novo Paciente{% endblock %}
{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="card-title mb-0">Cadastrar Novo Paciente</h4>
        </div>
        <div class="card-body">
          <form method="POST">
            {% csrf_token %}
            <!-- Nome -->
            <div class="mb-3">
              <label for="id_nome" class="form-label">Nome Completo <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="id_nome" name="nome" maxlength="150" required
                placeholder="Digite o nome do paciente">
            </div>
            <!-- CPF -->
            <div class="mb-3">
              <label for="id_cpf" class="form-label">CPF <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="id_cpf" name="cpf" maxlength="14" required
                placeholder="000.000.000-00">
            </div>
            <!-- E-mail -->
            <div class="mb-3">
              <label for="id_email" class="form-label">E-mail <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="id_email" name="email" maxlength="254" required
                placeholder="exemplo@email.com">
            </div>
            <!-- Telefone (Opcional) -->
            <div class="mb-3">
              <label for="id_telefone" class="form-label">Telefone</label>
              <input type="text" class="form-control" id="id_telefone" name="telefone" maxlength="15"
                placeholder="(00) 00000-0000">
            </div>
            <!-- Data de Nascimento -->
            <div class="mb-3">
              <label for="id_data_nascimento" class="form-label">Data de Nascimento <span
                  class="text-danger">*</span></label>
              <input type="date" class="form-control" id="id_data_nascimento" name="data_nascimento" required>
            </div>
            <!-- Botões -->
            <div class="d-flex justify-content-between align-items-center mt-4">
              <a href="#" class="btn btn-outline-secondary">Voltar</a>
              <button type="submit" class="btn btn-success">
                <i class="fa-solid fa-floppy-disk me-2"></i>
                Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>{% endblock %}
