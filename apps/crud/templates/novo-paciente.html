{% extends 'base-crud.html' %}
{% load static %}
{% block title %}CRUD | Novo Paciente{% endblock %}
{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="card-title mb-0">Cadastrar Novo Paciente</h4>
        </div>
        <div class="card-body">
          <form method="POST" action="{% url 'novo-paciente' %}">
            {% csrf_token %}

            <!-- Linha 1: Nome Completo (ocupando mais espaço) e CPF -->
            <div class="row">
              <div class="col-md-8 mb-3">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="nome" name="nome" maxlength="150" required
                  placeholder="Digite o nome do paciente">
              </div>
              <div class="col-md-4 mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="cpf" name="cpf" maxlength="14" required
                  placeholder="000.000.000-00">
              </div>
            </div>

            <!-- Linha 2: E-mail e Telefone -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" maxlength="254" required
                  placeholder="exemplo@email.com">
              </div>
              <div class="col-md-6 mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefone" name="telefone" maxlength="15"
                  placeholder="(00) 00000-0000" required>
              </div>
            </div>

            <!-- Linha 3: Data de Nascimento (você também pode dividir com outro campo se quiser) -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="data_nascimento" class="form-label">Data de Nascimento</label>
                <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" required>
              </div>
            </div>

            <!-- Sintomas (mantido em linha inteira pois é um textarea maior) -->
            <div class="mb-3">
              <label for="sintomas" class="form-label">Sintomas</label>
              <textarea class="form-control" id="sintomas" name="sintomas" rows="3"
                placeholder="Descreva os sintomas do paciente (opcional)..."></textarea>
            </div>

            <!-- Botões -->
            <div class="d-flex justify-content-between align-items-center mt-4">
              <a href="{% url 'index' %}" class="btn btn-outline-secondary">Voltar</a>
              <button type="submit" class="btn btn-success">
                <i class="fa-solid fa-floppy-disk me-2"></i>
                Salvar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="{% static 'js/script.js' %}"></script>
{% endblock %}
