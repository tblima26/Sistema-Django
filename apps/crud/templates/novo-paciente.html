{% extends 'base-crud.html' %}
{% load static %}

{% block title %}Novo Paciente{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="d-flex align-items-center mb-3">
        <h1 class="h3 fw-bold text-dark mb-0">
            <i class="fa-solid fa-user-plus text-success me-2"></i> Cadastrar Novo Paciente
        </h1>
    </div>
    <hr class="mb-4">

    {% if error %}
        <div class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <div>{{ error }}</div>
        </div>
    {% endif %}

    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <form action="{% url 'novo-paciente' %}" method="POST" novalidate>
                {% csrf_token %}
                {% include 'includes/form.html' %}
                <div class="d-flex justify-content-start gap-2 mt-4 pt-3 border-top">
                    <button type="submit" class="btn btn-success px-4">
                        <i class="fa-solid fa-check me-1"></i> Cadastrar
                    </button>
                    <a href="/" class="btn btn-outline-secondary px-4">
                        <i class="fa-solid fa-arrow-left me-1"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'js/script.js' %}"></script>
{% endblock %}
