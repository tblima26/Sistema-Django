{% extends 'base-crud.html' %}
{% load static %}
{% block title %}CRUD | Alterar Paciente{% endblock %}
{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="card-title mb-0">Alterar Paciente</h4>
        </div>
        <div class="card-body">
          <!-- Certifique-se de usar o nome exato da URL: 'alterar_paciente' -->
          <form method="POST" action="{% url 'alterar_paciente' paciente.codigo_paciente %}">
            {% csrf_token %}
            {% includes 'includes/form.html' %}
            <!-- Botões -->
            <div class="d-flex justify-content-between align-items-center mt-4">
              <a href="{% url 'index' %}" class="btn btn-outline-secondary">Voltar</a>
              <button type="submit" class="btn btn-success">
                <i class="fa-solid fa-floppy-disk me-2"></i>
                Alterar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="{% static 'js/script.js' %}"></script>
{% endblock %}
