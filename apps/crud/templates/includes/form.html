<div class="row mt-4">
    <div class="col-12 col-md-6 mb-3">
        <label for="{{ form.nome.id_for_label }}" class="form-label fw-semibold text-secondary">
            <i class="fa-solid fa-user me-1 text-success"></i> Nome:
        </label>
        {{ form.nome }}
    </div>
    <div class="col-12 col-md-6 mb-3">
        <label for="{{ form.email.id_for_label }}" class="form-label fw-semibold text-secondary">
            <i class="fa-solid fa-envelope me-1 text-success"></i> E-mail:
        </label>
        {{ form.email }}
        {% for erro in form.email.errors %}
            <div class="text-danger small mt-1">{{ erro }}</div>
        {% endfor %}
    </div>
    <div class="col-12 col-md-6 col-lg-4 mb-3">
        <label for="{{ form.telefone.id_for_label }}" class="form-label fw-semibold text-secondary">
            <i class="fa-solid fa-phone me-1 text-success"></i> Telefone:
        </label>
        {{ form.telefone }}
    </div>
    <div class="col-12 col-md-6 col-lg-4 mb-3">
        <label for="{{ form.cpf.id_for_label }}" class="form-label fw-semibold text-secondary">
            <i class="fa-solid fa-id-card me-1 text-success"></i> CPF:
        </label>
        {{ form.cpf }}
        {% for erro in form.cpf.errors %}
            <div class="text-danger small mt-1">{{ erro }}</div>
        {% endfor %}
    </div>
    <div class="col-12 col-md-6 col-lg-4 mb-3">
        <label for="{{ form.data_nascimento.id_for_label }}" class="form-label fw-semibold text-secondary">
            <i class="fa-solid fa-calendar-days me-1 text-success"></i> Data de Nascimento:
        </label>
        {{ form.data_nascimento }}
    </div>
    <div class="col-12 mb-3">
        <label for="{{ form.sintomas.id_for_label }}" class="form-label fw-semibold text-secondary">
            <i class="fa-solid fa-notes-medical me-1 text-success"></i> Sintomas:
        </label>
        {{ form.sintomas }}
    </div>
</div>
